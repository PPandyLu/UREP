[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urep-gsd"
version = "1.0.0"
description = "Image-based ground sampling distance estimation models"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.5,<2.6", "torchvision>=0.20,<0.21", "numpy>=1.24,<3", "Pillow>=9"]

[tool.setuptools.packages.find]
where = ["src"]
